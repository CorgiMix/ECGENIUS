[project]
name = "ecgproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "typesafe-sdk>=0.7.5",
    "wfdb>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
